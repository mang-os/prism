[build-system]
requires = ["hatchling>=1.26,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "prism-search"
version = "0.1.0"
description = "An educational segmented hybrid search infrastructure"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "numpy>=2,<3", "pydantic>=2.10,<3", "prometheus-client>=0.21,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.4,<6", "scikit-learn==1.6.1"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "build>=1,<2", "hatchling>=1.26,<2", "editables>=0.5,<1", "psutil>=6,<9"]

[project.scripts]
prism = "prism.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["semantic: requires a provisioned local embedding model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

