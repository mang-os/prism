name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install locked dependencies
        run: uv sync --python 3.11 --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts benchmarks
      - name: Format
        run: uv run --no-sync ruff format --check src tests scripts benchmarks
      - name: Types
        run: uv run --no-sync mypy src/prism
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Package
        run: uv run --no-sync python -m build --wheel
      - name: HTTP and search smoke
        run: uv run --no-sync python scripts/smoke.py

