name: Heavy verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - name: Install locked semantic environment
        run: uv sync --python 3.11 --locked --extra dev --extra semantic
      - name: Verify replica failover and partial results
        run: uv run --no-sync pytest -q tests/test_distributed.py
      - name: Prepare pinned model and checksum-checked SciFact data
        run: |
          uv run --no-sync prism model download --revision 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
          uv run --no-sync python benchmarks/prepare_scifact.py
      - name: Start OpenSearch baseline
        run: docker compose -f docker/compose.benchmark.yaml up -d --wait
      - name: Run SciFact relevance and OpenSearch comparison
        run: |
          uv run --no-sync prism benchmark --run-config benchmarks/configs/scifact.yaml
          uv run --no-sync python benchmarks/export_summary.py --report artifacts/scifact/report.json --output artifacts/scifact/summary.json
          uv run --no-sync python -c "import json; r=json.load(open('artifacts/scifact/summary.json')); assert r['metadata']['external_status']=='measured'"
      - name: Repeat HTTP load measurements
        run: |
          index_root=$(find artifacts/scifact -maxdepth 1 -type d -name 'index-*' -print -quit)
          test -n "$index_root"
          for repeat in 1 2 3; do
            uv run --no-sync python benchmarks/load_test.py --index-root "$index_root" --queries datasets/scifact/prism-queries.jsonl --samples 1000 --output "artifacts/performance/repeat-${repeat}/report.json"
          done
          uv run --no-sync python benchmarks/summarize_load.py --reports artifacts/performance/repeat-{1,2,3}/report.json --timeout-ms 500 --output artifacts/performance/summary.json
      - name: Run synthetic scale probe
        run: uv run --no-sync python benchmarks/synthetic_scale.py --index-root artifacts/scale/index --output artifacts/scale/report.json --documents 50000 --queries 100
      - name: Upload measured reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-heavy-reports
          path: |
            artifacts/scifact/summary.json
            artifacts/performance/repeat-*/report.json
            artifacts/performance/summary.json
            artifacts/performance/repeat-*/server-metrics.prom
            artifacts/performance/repeat-*/server.log
            artifacts/scale/report.json
          if-no-files-found: warn
